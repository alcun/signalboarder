<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Signalboarder's own idiom: amber lamps on black, the way the board renders
       everything. Three lit rows of a dot matrix, reading as a departure
       board at 16px rather than as a logo. -->
  <rect width="32" height="32" fill="#000000"/>
  <g fill="#ffb000">
    <circle cx="6" cy="9" r="2.1"/><circle cx="13" cy="9" r="2.1"/><circle cx="20" cy="9" r="2.1"/><circle cx="27" cy="9" r="2.1"/>
    <circle cx="6" cy="16" r="2.1"/><circle cx="13" cy="16" r="2.1"/>
  </g>
  <g fill="#7a5400">
    <circle cx="20" cy="16" r="2.1"/><circle cx="27" cy="16" r="2.1"/>
    <circle cx="6" cy="23" r="2.1"/><circle cx="13" cy="23" r="2.1"/><circle cx="20" cy="23" r="2.1"/><circle cx="27" cy="23" r="2.1"/>
  </g>
</svg>
