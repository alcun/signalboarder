services:
  signalboarder:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
        PUBLIC_SIGNALBOARDER_API: ${PUBLIC_SIGNALBOARDER_API:-http://localhost:3000}
        PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
        PUBLIC_LIZARD_KEY: ${PUBLIC_LIZARD_KEY:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
